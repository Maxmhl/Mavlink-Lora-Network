; LoRa Mesh Network firmware — one image, role selected via NVS config.
; Environments differ only in board + pin variant.

[platformio]
default_envs = heltec_v3, tbeam_1w, sensecap_p1

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
extra_scripts = post:merge_firmware.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
lib_deps =
    jgromes/RadioLib@^7.1.2
    bblanchon/ArduinoJson@^7.2.0
    mikalhart/TinyGPSPlus@^1.0.3
    lewisxhe/XPowersLib@^0.2.4
    adafruit/Adafruit BME280 Library@^2.2.4
    olikraus/U8g2@^2.35.19

; Heltec WiFi LoRa 32 V3 — ESP32-S3 + SX1262, native USB-CDC
[env:heltec_v3]
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -DVARIANT_HELTEC_V3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; LilyGo T-Beam 1W — ESP32-S3 + SX1262 + 1W PA + L76K GNSS + AXP2101
[env:tbeam_1w]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DVARIANT_TBEAM_1W
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; LilyGo T-Beam v1.1/v1.2 (classic ESP32 + SX1262 + NEO GPS + AXP192/AXP2101)
[env:tbeam_v12]
board = ttgo-t-beam
build_flags =
    ${env.build_flags}
    -DVARIANT_TBEAM_V12

; Seeed SenseCAP Solar Node P1 — XIAO ESP32-S3 + Wio-SX1262 (B2B connector)
[env:sensecap_p1]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DVARIANT_SENSECAP_P1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
